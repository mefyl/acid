include:
  - local: '/.logistic/ci/.gitlab-ci-template.yml'

toolchain:
  extends: .toolchain
  variables:
    OCAML_VERSION: "4.12.0"
    OPAM_PACKAGES: "js_of_ocaml schematic"

toolchain:no-schematic:
  extends: .toolchain
  variables:
    OCAML_VERSION: "4.12.0"
    OPAM_PACKAGES: "js_of_ocaml"
    OPAM_WITHOUT_PACKAGES: "schematic"
    VARIANT: "-no-schematic"

toolchain:no-jsoo:
  extends: .toolchain
  variables:
    OCAML_VERSION: "4.12.0"
    OPAM_PACKAGES: "schematic"
    OPAM_WITHOUT_PACKAGES: "js_of_ocaml"
    VARIANT: "-no-jsoo"

toolchain:none:
  extends: .toolchain
  variables:
    OCAML_VERSION: "4.12.0"
    OPAM_WITHOUT_PACKAGES: "schematic js_of_ocaml"
    VARIANT: "-none"

build:
  extends: .ocaml-build
  dependencies:
    - toolchain
  needs:
    - toolchain

build:no-schematic:
  extends: .ocaml-build
  dependencies:
    - toolchain:no-schematic
  needs:
    - toolchain:no-schematic
  variables:
    OCAML_VERSION: "4.12.0"
    VARIANT: "-no-schematic"

build:no-jsoo:
  extends: .ocaml-build
  dependencies:
    - toolchain:no-jsoo
  needs:
    - toolchain:no-jsoo
  variables:
    DUNE_PACKAGES: "acid"
    OCAML_VERSION: "4.12.0"
    VARIANT: "-no-jsoo"

build:none:
  extends: .ocaml-build
  dependencies:
    - toolchain:none
  needs:
    - toolchain:none
  variables:
    DUNE_PACKAGES: "acid"
    OCAML_VERSION: "4.12.0"
    VARIANT: "-none"

check:
  extends: .ocaml-check
  dependencies:
    - build
  needs:
    - build

check:no-schematic:
  extends: .ocaml-check
  dependencies:
    - build:no-schematic
  needs:
    - build:no-schematic
  variables:
    OCAML_VERSION: "4.12.0"
    VARIANT: "-no-schematic"

check:no-jsoo:
  extends: .ocaml-check
  dependencies:
    - build:no-jsoo
  needs:
    - build:no-jsoo
  variables:
    DUNE_PACKAGES: "acid"
    OCAML_VERSION: "4.12.0"
    VARIANT: "-no-jsoo"

check:none:
  extends: .ocaml-check
  dependencies:
    - build:none
  needs:
    - build:none
  variables:
    DUNE_PACKAGES: "acid"
    OCAML_VERSION: "4.12.0"
    VARIANT: "-none"

package:
  extends: .ocaml-package
  dependencies:
    - check
  needs:
    - check
    - check:no-schematic
    - check:no-jsoo
    - check:none

opam:
  extends: .ocaml-opam
  dependencies:
    - check
  needs:
    - check
    - check:no-schematic
    - check:no-jsoo
    - check:none
